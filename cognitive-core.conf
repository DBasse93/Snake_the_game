# cognitive-core.conf — Snake Game Project Configuration

# ===== PROJECT IDENTITY =====
CC_PROJECT_NAME="Snake_the_game"
CC_PROJECT_DESCRIPTION="Classic Snake game in Java — developed with AI-assisted Human-in-the-Loop workflow"
CC_ORG="DBasse93"

# ===== PLATFORM =====
CC_PLATFORM="claude"

# ===== LANGUAGE & STACK =====
CC_LANGUAGE="java"
CC_LINT_EXTENSIONS=".java"
CC_LINT_COMMAND=""
CC_FORMAT_COMMAND=""
CC_TEST_COMMAND="mvn test"
CC_TEST_PATTERN="src/test/**/*.java"

# ===== DATABASE =====
CC_DATABASE="none"

# ===== ARCHITECTURE =====
CC_ARCHITECTURE="mvc"
CC_SRC_ROOT="src/main/java"
CC_TEST_ROOT="src/test/java"

# ===== AGENTS =====
CC_AGENTS="coordinator reviewer architect tester"
CC_COORDINATOR_MODEL="opus"
CC_SPECIALIST_MODEL="sonnet"

# ===== SKILLS =====
CC_SKILLS="session-resume code-review pre-commit fitness project-status"

# ===== HOOKS =====
CC_HOOKS="setup-env compact-reminder validate-bash validate-read validate-fetch validate-write post-edit-lint notify-complete"

# ===== COMPACT RULES =====
CC_COMPACT_RULES="
1. Java 21+, Maven project structure (src/main/java, src/test/java)
2. JavaFX for UI — no Swing
3. Human-in-the-Loop: every AI suggestion requires human review before commit
4. Git commits: conventional format — type(scope): subject
5. Run mvn test before every commit
"

# ===== SAFETY =====
CC_SECURITY_LEVEL="standard"

# ===== GIT =====
CC_MAIN_BRANCH="main"
CC_COMMIT_FORMAT="conventional"
CC_COMMIT_SCOPES="game ui ai core test docs"

# ===== PROJECT BOARD =====
CC_PROJECT_BOARD_PROVIDER="github"
CC_GITHUB_OWNER="DBasse93"
CC_GITHUB_REPO="DBasse93/Snake_the_game"
CC_REQUIRE_HUMAN_APPROVAL="true"
CC_REQUIRE_CLOSURE_VERIFICATION="true"
CC_REQUIRE_SHARED_STATE_APPROVAL="true"

# ===== CI/CD =====
CC_ENABLE_CICD="false"
CC_FITNESS_LINT="60"
CC_FITNESS_COMMIT="80"
CC_FITNESS_TEST="85"
CC_FITNESS_MERGE="90"
CC_FITNESS_DEPLOY="95"

# ===== NOTIFICATIONS =====
CC_NOTIFY_ENABLED="true"
CC_NOTIFY_CHANNELS="bell desktop"
CC_NOTIFY_EVENTS="Stop SubagentStop Notification"
CC_NOTIFY_MIN_DURATION="30"
